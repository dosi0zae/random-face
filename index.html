<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Random Face</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Random Face">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="app-icon-180.png">
<style>
  :root {
    --bg: #000; --bg2: #1c1c1e; --bg3: #2c2c2e;
    --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.36); --sep: rgba(84,84,88,.6);
    --label: #fff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
    --blue: #0a84ff; --red: #ff453a; --green: #30d158; --lemon: #fff35c;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--label); font-family: var(--font);
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; overscroll-behavior: none; overflow: hidden; }
  body { display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font-family: inherit; }

  /* ---- 상단 ---- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; transition: opacity .35s; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .tools { display: flex; gap: 10px; }
  .pill { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border: 0;
    border-radius: 999px; background: var(--fill); color: var(--label); font-size: 16px; font-weight: 600; cursor: pointer;
    transition: transform .12s, background .2s, opacity .2s; }
  .pill:active { transform: scale(.95); background: var(--fill2); }
  .pill svg { width: 18px; height: 18px; }
  .pill.icon { width: 40px; padding: 0; justify-content: center; }
  .pill.destructive { color: var(--red); }
  .pill[hidden] { display: none; }
  body.rolling header, body.rolling footer .sub { opacity: .2; pointer-events: none; }

  /* ---- 사진 영역 ---- */
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px; position: relative; }
  #empty { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; color: var(--label2); }
  #empty .big { width: 120px; height: 120px; border-radius: 32px; background: var(--fill); display: grid; place-items: center; }
  #empty .big svg { width: 56px; height: 56px; color: var(--label2); }
  #empty h2 { margin: 0; color: var(--label); font-size: 26px; font-weight: 700; }
  #empty p { margin: 0; font-size: 15px; line-height: 1.5; }
  .cta { width: 130px; height: 50px; padding: 0; border: 0; border-radius: 14px; background: var(--blue); color: #fff;
    display: grid; place-items: center; cursor: pointer; transition: transform .12s; }
  .cta svg { width: 28px; height: 28px; }
  .cta:active { transform: scale(.94); opacity: .85; }

  #stage { position: relative; display: none; line-height: 0; }
  #stage.on { display: inline-block; }
  #photo { max-width: calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right));
    max-height: var(--maxh, 70vh); border-radius: 18px; display: block; }

  /* 얼굴 표시 */
  .face { position: absolute; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.85);
    box-shadow: 0 0 0 1px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.15); cursor: pointer;
    transition: opacity .25s, border-color .25s, transform .25s; }
  .face.off { border-style: dashed; border-color: rgba(255,255,255,.9); background: rgba(0,0,0,.5); }
  .face.off::after { content: '✕'; position: absolute; inset: 0; display: grid; place-items: center;
    color: rgba(255,255,255,.85); font: 700 clamp(12px, 30%, 28px)/1 var(--font); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .face.done { border-color: rgba(255,243,92,.6); }
  .face.done::before { content: '✓'; position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--lemon); color: #000; font: 800 14px/22px var(--font); text-align: center; }
  body.rolling .face { border-color: rgba(255,255,255,.25); border-style: solid; }
  body.rolling .face::after, body.rolling .face::before { display: none; }

  /* 스포트라이트 */
  #spot { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0;
    box-shadow: 0 0 0 200vmax rgba(0,0,0,.62); transition: left .12s ease-out, top .12s ease-out, width .12s, height .12s, opacity .3s; }
  #spot.on { opacity: 1; }
  /* ---- 당첨 화면: 당 (얼굴) 첨 ---- */
  #win { --s: min(52vh, 40vw); position: fixed; inset: 0; z-index: 6; display: none;
    align-items: center; justify-content: center; gap: min(4vw, 40px);
    background: rgba(0,0,0,0); transition: background .6s; }
  #win.on { display: flex; background: rgba(0,0,0,.94); animation: winbg .6s ease-out; }
  @keyframes winbg { from { background: rgba(0,0,0,0); } }
  #win.out { opacity: 0; transition: opacity .3s; }
  #wface { position: relative; width: var(--s); height: var(--s); flex: none;
    transition: transform .95s cubic-bezier(.16,1,.3,1); will-change: transform; }
  #wface img { width: 100%; height: 100%; border-radius: 50%; display: block; object-fit: cover; }
  /* 무지개 링 (착지 후 빙글빙글) */
  #wface::before { content: ''; position: absolute; inset: calc(var(--s) * -.035); border-radius: 50%;
    padding: calc(var(--s) * .028); opacity: 0; transition: opacity .3s;
    background: conic-gradient(#fff35c, #ff8a1f, #ff3d7f, #b44dff, #3df2ff, #b8ff3d, #fff35c);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 2.4s linear infinite; }
  #wface::after { content: ''; position: absolute; inset: 0; border-radius: 50%; opacity: 0; transition: opacity .4s;
    box-shadow: 0 0 calc(var(--s) * .12) rgba(255,243,92,.45), 0 0 calc(var(--s) * .3) rgba(255,61,127,.25); }
  #win.land #wface::before, #win.land #wface::after { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #win .ch { font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-weight: 900; line-height: 1; font-size: min(18vw, 26vh); flex: none;
    color: transparent; background: linear-gradient(160deg, #fff35c 10%, #ffb21c 50%, #ff3d7f 95%);
    -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 0 .08em rgba(255,200,60,.4));
    opacity: 0; transition: transform .55s cubic-bezier(.3,1.6,.5,1), opacity .25s; }
  #win .ch.l { transform: translateX(40%) scale(.4) rotate(-12deg); }
  #win .ch.r { transform: translateX(-40%) scale(.4) rotate(12deg); }
  #win.land .ch { opacity: 1; transform: none; }
  #win.land .ch.r { transition-delay: .12s; }
  #win .tap { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    color: var(--label3); font-size: 15px; opacity: 0; transition: opacity .4s 1s; }
  #win.land .tap { opacity: 1; }

  #busy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(0,0,0,.55); border-radius: 18px; color: var(--label); font-size: 17px; font-weight: 600; line-height: 1.2; }
  #busy.on { display: flex; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---- 하단 ---- */
  header, footer { position: relative; z-index: 2; }
  footer { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 20px 22px; min-height: 110px; }
  footer .sub { color: var(--label2); font-size: 15px; text-align: center; transition: opacity .35s; line-height: 1.4; }
  footer .sub b { color: var(--label); }
  #go { height: 54px; min-width: 200px; padding: 0 36px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--label); color: #000; font-size: 19px; font-weight: 700; transition: transform .12s, opacity .3s; }
  #go:active { transform: scale(.96); }
  #go:disabled { opacity: .3; }
  #go[hidden] { display: none; }
  body.rolling #go { opacity: 0; pointer-events: none; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }

  /* ---- 설정 시트 / 알림 (iOS) ---- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center;
    padding: 16px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal { width: 100%; max-width: 420px; background: var(--bg2); border-radius: 14px; overflow: hidden;
    transform: translateY(24px) scale(.98); transition: transform .3s cubic-bezier(.2,.9,.3,1); }
  .overlay.open .modal { transform: none; }
  .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 56px; padding: 0 16px; border-bottom: .5px solid var(--sep); }
  .nav h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .nav .done { justify-self: end; background: none; border: 0; color: var(--blue); font-size: 17px; font-weight: 600; cursor: pointer; padding: 8px 0; }
  .group-title { color: var(--label2); font-size: 13px; padding: 20px 20px 6px; }
  .group { margin: 0 16px; background: var(--bg3); border-radius: 10px; overflow: hidden; }
  .cell { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 16px; font-size: 17px; }
  .cell + .cell { border-top: .5px solid var(--sep); }
  .note { color: var(--label2); font-size: 13px; padding: 8px 20px 20px; line-height: 1.4; }
  .switch { position: relative; width: 51px; height: 31px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch i { position: absolute; inset: 0; background: var(--fill2); border-radius: 999px; transition: background .25s; }
  .switch i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: transform .25s cubic-bezier(.3,.7,.4,1); }
  .switch input:checked + i { background: var(--green); }
  .switch input:checked + i::after { transform: translateX(20px); }

  #alert .box { width: 270px; border-radius: 14px; overflow: hidden; text-align: center;
    background: rgba(44,44,46,.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    transform: scale(1.1); transition: transform .25s cubic-bezier(.2,.9,.3,1); }
  #alert.open .box { transform: none; }
  #alert .txt { padding: 19px 16px 18px; }
  #alert h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  #alert p { margin: 0; font-size: 13px; opacity: .85; line-height: 1.35; }
  #alert .btns { display: flex; border-top: .5px solid var(--sep); }
  #alert .btns button { flex: 1; height: 44px; border: 0; background: none; font-size: 17px; color: var(--blue); cursor: pointer; }
  #alert .btns button + button { border-left: .5px solid var(--sep); }
  #alert .btns .ok { font-weight: 600; }
  #alert .btns .ok.destructive { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>Random Face</h1>
  <div class="tools">
    <button class="pill destructive" id="reset" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      초기화
    </button>
    <button class="pill" id="change" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      사진 바꾸기
    </button>
    <button class="pill icon" id="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="empty">
    <button class="cta" id="pickBtn" aria-label="사진 선택"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7.6 6.5H4.5A2 2 0 0 0 2.5 8.5v9a2 2 0 0 0 2 2h15a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-3.1z"/><circle cx="12" cy="13" r="3.6"/></svg></button>
  </div>
  <div id="stage">
    <img id="photo" alt="">
    <div id="faces"></div>
    <div id="spot"></div>
    <div id="busy"><div class="spinner"></div><span id="busyText">얼굴 찾는 중…</span></div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</main>

<footer>
  <div class="sub" id="status">&nbsp;</div>
  <button id="go" hidden>뽑기</button>
</footer>
<div id="win">
  <span class="ch l">당</span>
  <div id="wface"><img id="wimg" alt=""></div>
  <span class="ch r">첨</span>
  <div class="tap">화면을 탭하면 돌아가요</div>
</div>
<canvas id="fx"></canvas>

<div class="overlay" id="sheet">
  <div class="modal">
    <div class="nav"><span></span><h2>설정</h2><button class="done" id="done">완료</button></div>
    <div class="group-title">뽑기</div>
    <div class="group">
      <label class="cell">이미 뽑힌 사람 제외 <span class="switch"><input type="checkbox" id="unique"><i></i></span></label>
    </div>
    <div class="group-title">효과</div>
    <div class="group">
      <label class="cell">효과음 <span class="switch"><input type="checkbox" id="sound"><i></i></span></label>
    </div>
    <div class="note">얼굴을 탭하면 뽑기에서 빼거나 다시 넣을 수 있어요.<br>못 찾은 얼굴은 사진의 빈 곳을 탭해서 직접 추가하세요.</div>
  </div>
</div>

<div class="overlay" id="alert">
  <div class="box">
    <div class="txt"><h3 id="alertTitle"></h3><p id="alertMsg"></p></div>
    <div class="btns"><button id="alertCancel">취소</button><button class="ok" id="alertOk">확인</button></div>
  </div>
</div>

<script type="module">
import { FilesetResolver, FaceDetector } from './mediapipe/vision_bundle.mjs';

const $ = id => document.getElementById(id);
const KEY = 'face-pick-v1';
const settings = { unique: true, sound: true };
try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch (e) {} };

// faces: { x, y, w, h } (원본 대비 0~1 비율), off: 제외, done: 이미 뽑힘, manual: 직접 추가
let faces = [];
let busy = false;

function randInt(min, max) {
  const range = max - min + 1, limit = Math.floor(0x100000000 / range) * range, buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
  return min + (buf[0] % range);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- iOS 알림창 ----------
function ask(title, msg, { ok = '확인', cancel = '취소', destructive = false } = {}) {
  return new Promise(resolve => {
    $('alertTitle').textContent = title; $('alertMsg').textContent = msg;
    $('alertOk').textContent = ok; $('alertOk').classList.toggle('destructive', destructive);
    $('alertCancel').style.display = cancel ? '' : 'none'; $('alertCancel').textContent = cancel || '';
    const close = v => { $('alert').classList.remove('open'); resolve(v); };
    $('alertOk').onclick = () => close(true);
    $('alertCancel').onclick = () => close(false);
    $('alert').classList.add('open');
  });
}

// ---------- 효과음 ----------
let ac = null;
function audio() {
  if (!settings.sound) return null;
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
  return ac;
}
function tone(freq, dur, type = 'square', vol = .08) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const tick = p => tone(500 + p * 700, .04, 'square', .05);
const chime = () => [784, 988, 1319, 1568].forEach((f, i) => setTimeout(() => tone(f, .6, 'sine', .12), i * 90));
// 지이잉: 올라가는 스윕음
function whoosh() {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(1400, t + .85);
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(5000, t + .85);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.07, t + .15); g.gain.exponentialRampToValueAtTime(.0001, t + .9);
  o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + .95);
}
function popSound() {
  const a = audio(); if (!a) return;
  const t = a.currentTime, len = a.sampleRate * .12, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = .8; g.gain.value = .5;
  src.connect(f).connect(g).connect(a.destination); src.start(t);
}

// ---------- 얼굴 인식 (MediaPipe, 기기 안에서만 실행) ----------
let detectorP = null;
function getDetector() {
  detectorP = detectorP || (async () => {
    const fileset = await FilesetResolver.forVisionTasks('./mediapipe/wasm');
    return FaceDetector.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: './mediapipe/blaze_face_full_range.tflite', delegate: 'CPU' },
      runningMode: 'IMAGE', minDetectionConfidence: .4,
    });
  })();
  return detectorP;
}

// 단체 사진의 작은 얼굴도 잡도록: 전체 + 2×2, 3×3, 4×4 겹치는 타일로 나눠 검사 후 중복 제거
async function detectFaces(img) {
  const det = await getDetector();
  const W = img.naturalWidth, H = img.naturalHeight;
  const scale = Math.min(1, 3200 / Math.max(W, H));
  const base = document.createElement('canvas');
  base.width = Math.round(W * scale); base.height = Math.round(H * scale);
  base.getContext('2d').drawImage(img, 0, 0, base.width, base.height);
  const BW = base.width, BH = base.height;

  const found = [];
  const run = (sx, sy, sw, sh) => {
    const c = document.createElement('canvas');
    const s = 640 / Math.max(sw, sh); // 타일을 긴 변 640px로 맞춤 (작은 얼굴은 확대 효과)
    c.width = Math.round(sw * s); c.height = Math.round(sh * s);
    c.getContext('2d').drawImage(base, sx, sy, sw, sh, 0, 0, c.width, c.height);
    for (const d of det.detect(c).detections) {
      const b = d.boundingBox, score = d.categories?.[0]?.score ?? 0;
      found.push({ x: (sx + b.originX / s) / BW, y: (sy + b.originY / s) / BH, w: b.width / s / BW, h: b.height / s / BH, score });
    }
  };
  run(0, 0, BW, BH);
  for (const n of [2, 3, 4, 6]) {
    const tw = BW / n * 1.35, th = BH / n * 1.35;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const sx = Math.max(0, Math.min(BW - tw, (BW / n) * i - (tw - BW / n) / 2));
      const sy = Math.max(0, Math.min(BH - th, (BH / n) * j - (th - BH / n) / 2));
      run(sx, sy, tw, th);
      await sleep(0); // 화면 멈춤 방지
    }
  }
  // 중복 제거 (점수 높은 순으로, 많이 겹치면 버림)
  found.sort((a, b) => b.score - a.score);
  const keep = [];
  for (const f of found) {
    if (f.score < .5) continue;
    const dup = keep.some(k => {
      const ix = Math.max(0, Math.min(f.x + f.w, k.x + k.w) - Math.max(f.x, k.x));
      const iy = Math.max(0, Math.min(f.y + f.h, k.y + k.h) - Math.max(f.y, k.y));
      const inter = ix * iy * BW * BH, a1 = f.w * f.h * BW * BH, a2 = k.w * k.h * BW * BH;
      return inter / Math.min(a1, a2) > .35;
    });
    if (!dup) keep.push(f);
  }
  // 다른 얼굴들보다 지나치게 작은 건 오탐(무늬·그림)으로 보고 제외
  if (keep.length >= 3) {
    const ws = keep.map(f => f.w * BW).sort((a, b) => a - b), med = ws[ws.length >> 1];
    for (let i = keep.length - 1; i >= 0; i--) if (keep[i].w * BW < med * .35 && keep[i].score < .8) keep.splice(i, 1);
  }
  // 동그라미가 얼굴을 넉넉히 감싸도록 정사각형 + 확장 (화면 비율 기준)
  return keep.map(f => {
    const cx = (f.x + f.w / 2) * BW, cy = (f.y + f.h / 2) * BH;
    const size = Math.max(f.w * BW, f.h * BH) * 1.3;
    return { x: (cx - size / 2) / BW, y: (cy - size / 2) / BH, w: size / BW, h: size / BH };
  }).sort((a, b) => a.x - b.x);
}

// ---------- 화면 ----------
const photo = $('photo'), stage = $('stage'), facesEl = $('faces'), spot = $('spot');

function fitPhoto() {
  const avail = innerHeight - $('stage').closest('main').getBoundingClientRect().top - document.querySelector('footer').offsetHeight - 8;
  document.documentElement.style.setProperty('--maxh', Math.max(200, avail) + 'px');
}
addEventListener('resize', () => { fitPhoto(); sizeFx(); });

function renderFaces() {
  facesEl.innerHTML = '';
  faces.forEach((f, i) => {
    const el = document.createElement('div');
    el.className = 'face' + (f.off ? ' off' : '') + (f.done && settings.unique ? ' done' : '');
    Object.assign(el.style, { left: f.x * 100 + '%', top: f.y * 100 + '%', width: f.w * 100 + '%', height: f.h * 100 + '%' });
    el.dataset.i = i;
    facesEl.appendChild(el);
  });
  const eligible = candidates().length;
  const total = faces.length;
  const doneN = faces.filter(f => f.done).length;
  $('reset').hidden = !doneN;
  $('go').disabled = eligible < 1 || $('busy').classList.contains('on');
  let msg;
  if (!total) msg = '얼굴을 찾지 못했어요 · 사진의 얼굴을 탭해서 직접 추가하세요';
  else if (!eligible && settings.unique && doneN) msg = '모두 한 번씩 뽑혔어요 · 초기화를 눌러주세요';
  else msg = `<b>${total}명</b> 찾음 · 뽑기 대상 <b>${eligible}명</b>` + '<br>얼굴 탭: 빼기/넣기 · 빈 곳 탭: 얼굴 추가';
  $('status').innerHTML = msg;
}
const candidates = () => faces.map((f, i) => i).filter(i => !faces[i].off && !(settings.unique && faces[i].done));

function clearWin() {
  spot.className = '';
}

async function loadFile(file) {
  if (!file || busy) return;
  busy = true;
  try { await loadFileInner(file); } finally { busy = false; renderFaces(); }
}
async function loadFileInner(file) {
  clearWin();
  const url = URL.createObjectURL(file);
  photo.src = url;
  await photo.decode().catch(() => {});
  $('empty').style.display = 'none';
  stage.classList.add('on');
  $('change').hidden = false; $('go').hidden = false;
  fitPhoto();
  faces = []; renderFaces();
  $('status').innerHTML = '&nbsp;';
  $('busy').classList.add('on'); $('busyText').textContent = '얼굴 찾는 중…';
  try {
    await sleep(30);
    faces = await detectFaces(photo);
  } catch (e) {
    console.error(e);
    await ask('얼굴 인식을 불러오지 못했어요', '빈 곳을 탭해서 얼굴을 직접 추가할 수 있어요.', { cancel: null });
  }
  $('busy').classList.remove('on');
  renderFaces();
}

$('pickBtn').onclick = () => $('file').click();
$('change').onclick = () => { if (!busy) $('file').click(); };
$('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
// 드래그&드롭 (PC 테스트용)
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

// 사진 탭: 얼굴이면 빼기/넣기, 빈 곳이면 얼굴 추가
stage.addEventListener('click', e => {
  if (busy) return;
  clearWin();
  const faceEl = e.target.closest('.face');
  if (faceEl) {
    const f = faces[+faceEl.dataset.i];
    if (f.manual) faces.splice(+faceEl.dataset.i, 1);
    else f.off = !f.off;
  } else {
    const r = photo.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
    if (px < 0 || px > 1 || py < 0 || py > 1) return;
    // 크기: 찾은 얼굴들의 중간 크기, 없으면 사진 짧은 변의 15%
    const sizes = faces.map(f => f.w * r.width).sort((a, b) => a - b);
    const sizePx = sizes.length ? sizes[sizes.length >> 1] : Math.min(r.width, r.height) * .15;
    faces.push({ x: px - sizePx / r.width / 2, y: py - sizePx / r.height / 2, w: sizePx / r.width, h: sizePx / r.height, manual: true });
  }
  renderFaces();
});

$('reset').onclick = async () => {
  if (busy) return;
  if (!(await ask('뽑힌 기록을 초기화할까요?', '모든 사람이 다시 뽑기 대상이 됩니다.', { ok: '초기화', destructive: true }))) return;
  faces.forEach(f => f.done = false); clearWin(); renderFaces();
};

// ---------- 뽑기 ----------
function placeSpot(f, grow = 1) {
  const cx = f.x + f.w / 2, cy = f.y + f.h / 2, w = f.w * grow, h = f.h * grow;
  Object.assign(spot.style, { left: (cx - w / 2) * 100 + '%', top: (cy - h / 2) * 100 + '%', width: w * 100 + '%', height: h * 100 + '%' });
}

$('go').onclick = async () => {
  if (busy) return;
  const pool = candidates();
  if (!pool.length) return;
  busy = true; audio();
  try { await roll(pool, faces); }
  catch (e) { console.error(e); clearWin(); }
  finally { document.body.classList.remove('rolling'); busy = false; renderFaces(); }
};

async function roll(pool, faces) {
  clearWin();
  document.body.classList.add('rolling');
  const winner = pool[randInt(0, pool.length - 1)];

  // 스포트라이트가 얼굴 사이를 옮겨 다니다 점점 느려짐
  spot.classList.add('on');
  const total = 3600, start = performance.now();
  let cur = -1;
  while (true) {
    const t = performance.now() - start, p = Math.min(1, t / total);
    if (p >= 1) break;
    let next = pool.length === 1 ? pool[0] : pool[randInt(0, pool.length - 1)];
    if (pool.length > 1) while (next === cur) next = pool[randInt(0, pool.length - 1)];
    cur = next; placeSpot(faces[cur]); tick(p);
    await sleep(55 + Math.pow(p, 3) * 420);
  }
  placeSpot(faces[winner]); tick(1);
  await sleep(380);

  // 당첨! 얼굴이 화면 중앙으로 지이잉 확대
  const f = faces[winner];
  f.done = true;
  await showWinner(f);
}

// ---------- 당첨 화면: 당 (얼굴) 첨 ----------
const win = $('win'), wface = $('wface');
function cropFace(f) {
  // 원본 해상도에서 얼굴 주변을 정사각형으로 잘라냄 (머리카락까지 살짝 여유)
  const W = photo.naturalWidth, H = photo.naturalHeight;
  const cx = (f.x + f.w / 2) * W, cy = (f.y + f.h / 2) * H;
  const size = Math.max(f.w * W, f.h * H) * 1.05;
  const c = document.createElement('canvas'); c.width = c.height = 720;
  const g = c.getContext('2d');
  g.fillStyle = '#111'; g.fillRect(0, 0, 720, 720);
  g.imageSmoothingQuality = 'high';
  g.drawImage(photo, cx - size / 2, cy - size / 2, size, size, 0, 0, 720, 720);
  return c.toDataURL('image/jpeg', .92);
}
async function showWinner(f) {
  $('wimg').src = cropFace(f);
  await $('wimg').decode().catch(() => {});
  // 사진 속 얼굴 위치 → 화면 중앙으로 (FLIP 애니메이션)
  const r = photo.getBoundingClientRect();
  const from = { x: r.left + (f.x + f.w / 2) * r.width, y: r.top + (f.y + f.h / 2) * r.height, s: f.w * r.width };
  win.classList.remove('land', 'out'); win.classList.add('on');
  const to = wface.getBoundingClientRect();
  const dx = from.x - (to.left + to.width / 2), dy = from.y - (to.top + to.height / 2), k = from.s / to.width;
  wface.style.transition = 'none';
  wface.style.transform = `translate(${dx}px, ${dy}px) scale(${k})`;
  void wface.offsetWidth;
  spot.classList.remove('on');
  whoosh();
  wface.style.transition = '';
  wface.style.transform = '';
  await sleep(950);
  // 착지: 당 / 첨 + 색종이
  win.classList.add('land');
  popSound(); chime();
  const c = wface.getBoundingClientRect();
  confetti(c.left + c.width / 2, c.top + c.height / 2, c.width * .8);
  await sleep(700);
}
win.addEventListener('click', () => {
  if (!win.classList.contains('land')) return;
  win.classList.add('out');
  setTimeout(() => { win.classList.remove('on', 'land', 'out'); clearWin(); }, 300);
});

// ---------- 색종이 (동그란 조각, 팡 터졌다 사라짐) ----------
const fx = $('fx'), ctx = fx.getContext('2d');
const COLORS = ['#fff35c', '#ffb21c', '#ff3d7f', '#b44dff', '#3df2ff', '#b8ff3d', '#2f9bff', '#ffffff'];
let bits = [], fxRunning = false, dpr = 1;
function sizeFx() { dpr = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; }
sizeFx();
const pick = a => a[(Math.random() * a.length) | 0];
function spawn(cx, cy, spread, amount, speedMul) {
  const reach = Math.max(innerWidth, innerHeight) / 1024;
  for (let i = 0; i < amount; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (6 + Math.pow(Math.random(), .6) * 32) * speedMul * reach * dpr;
    const sparkle = Math.random() < .18;
    bits.push({
      x: cx + (Math.random() - .5) * spread, y: cy + (Math.random() - .5) * spread,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 4 * dpr,
      r: (sparkle ? 1.5 + Math.random() * 1.5 : 3 + Math.pow(Math.random(), 1.6) * 7) * dpr,
      flip: Math.random() * Math.PI * 2, vf: .12 + Math.random() * .15, sway: Math.random() * Math.PI * 2,
      life: 0, max: 80 + Math.random() * 55, c: sparkle ? '#ffffff' : pick(COLORS), sparkle,
    });
  }
}
function confetti(x, y, size) {
  const cx = x * dpr, cy = y * dpr, s = size * dpr;
  spawn(cx, cy, s * .6, 320, 1);
  setTimeout(() => spawn(cx, cy, s, 160, .7), 90);
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(loop); }
}
function loop() {
  ctx.clearRect(0, 0, fx.width, fx.height);
  bits = bits.filter(b => ++b.life < b.max);
  for (const b of bits) {
    b.vx *= .95; b.vy = b.vy * .95 + .42 * dpr;
    if (b.vy > 2.8 * dpr) b.vy = 2.8 * dpr;
    b.sway += .07; b.flip += b.vf;
    b.x += b.vx + Math.sin(b.sway) * .7 * dpr; b.y += b.vy;
    const k = b.life / b.max, alpha = k < .55 ? 1 : 1 - (k - .55) / .45;
    const face = Math.abs(Math.cos(b.flip));
    ctx.globalAlpha = alpha * (b.sparkle ? (Math.random() < .5 ? 1 : .25) : .65 + .35 * face);
    ctx.fillStyle = b.c;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r, b.r * (b.sparkle ? 1 : .35 + .65 * face), b.sway, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (bits.length) requestAnimationFrame(loop);
  else { fxRunning = false; ctx.clearRect(0, 0, fx.width, fx.height); }
}

// ---------- 설정 ----------
const sheet = $('sheet');
$('openSettings').onclick = () => { $('unique').checked = settings.unique; $('sound').checked = settings.sound; sheet.classList.add('open'); };
$('done').onclick = () => sheet.classList.remove('open');
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.classList.remove('open'); });
['unique', 'sound'].forEach(id => $(id).addEventListener('change', e => { settings[id] = e.target.checked; persist(); if (faces.length || stage.classList.contains('on')) renderFaces(); }));

// 오프라인 준비: 모델을 미리 로드해 둠 (첫 사진 때 기다리지 않도록)
setTimeout(() => getDetector().catch(() => { detectorP = null; }), 800);

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
